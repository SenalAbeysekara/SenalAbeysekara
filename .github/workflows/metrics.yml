name: GitHub Analytics Cards

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Colombo"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate analytics SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: SenalAbeysekara
        run: python .github/scripts/generate_analytics.py

      - name: Commit analytics SVG
        run: |
          git config user.name "Senal Abeysekara"
          git config user.email "senaldushyantha@gmail.com"

          git add github-analytics.svg
          git commit --allow-empty -m "Update GitHub analytics"
          git push

name: GitHub Analytics Cards

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Colombo"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate analytics SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: SenalAbeysekara
        run: python .github/scripts/generate_analytics.py

      - name: Commit analytics SVG
        run: |
          if [[ -n $(git status --porcelain github-analytics.svg) ]]; then
            git config user.name "Senal Abeysekara"
            git config user.email "YOUR_VERIFIED_GITHUB_EMAIL"

            git add github-analytics.svg
            git commit -m "Update GitHub analytics"
            git push
          else
            echo "No analytics changes"
          fi
